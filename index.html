<script>
if(!window.storage){
  window.storage={
    async get(k){var v=localStorage.getItem(k);return v==null?null:{key:k,value:v};},
    async set(k,v){localStorage.setItem(k,v);return {key:k,value:v};},
    async delete(k){localStorage.removeItem(k);return {key:k,deleted:true};},
    async list(p){p=p||"";var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(p)===0)ks.push(k);}return {keys:ks};}
  };
}
</script>

/* สร้าง PDF ของหน้าสรุปผล (สำหรับมือถือ) ถ้าไม่มีไลบรารีจะถอยไปใช้ print */
async function exportPDF() {
    const el = document.getElementById("pdf-report");
    const jspdfNS = window.jspdf || window.jsPDF;
    if (!el || !window.html2canvas || !jspdfNS) {
        window.print();
        return;
    }
    try {
        const canvas = await window.html2canvas(el, {
            scale: 2,
            useCORS: true,
            backgroundColor: "#e9efed",
            ignoreElements: (n) => n.getAttribute && n.getAttribute("data-no-pdf") === "true",
        });
        const img = canvas.toDataURL("image/jpeg", 0.92);
        const JsPDF = jspdfNS.jsPDF || jspdfNS;
        const pdf = new JsPDF("p", "mm", "a4");
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        const imgH = (canvas.height * pw) / canvas.width;
        let heightLeft = imgH;
        let pos = 0;
        pdf.addImage(img, "JPEG", 0, pos, pw, imgH);
        heightLeft -= ph;
        while (heightLeft > 0) {
            pos -= ph;
            pdf.addPage();
            pdf.addImage(img, "JPEG", 0, pos, pw, imgH);
            heightLeft -= ph;
        }
        pdf.save("ผลการประเมินสมอง.pdf");
    }
    catch (e) {
        window.print();
    }
}

/* ย่อรูปที่อัปโหลดให้เล็กลงก่อนเก็บ เพื่อให้บันทึกข้ามครั้งได้ */
function downscaleImage(file, maxDim = 320) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                const w = Math.round(img.width * scale);
                const h = Math.round(img.height * scale);
                const canvas = document.createElement("canvas");
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL("image/jpeg", 0.82));
            };
            img.onerror = reject;
            img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
